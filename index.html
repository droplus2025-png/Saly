mount === 0 ? NOTIFICATION.NONE : NOTIFICATION.PENDING;\n    await ctx.put(store, next);\n    return rec;\n  }\n\n  /**\n   * Return against an existing invoice (customer return ← sale, supplier return ← purchase).\n   * The original invoice is never changed: the return is a new numbered operation linked by refId.\n   * Value = price recorded on the invoice; never more than what is left to return. Money: the party's open\n   * balance (only if the invoice had a debt part) is reduced first, the rest moves through the cash box.\n   */\n  const makeReturn = (kind) => ({ invoiceId, lines }) => atomic(async (ctx) => {\n    const cust = kind === 'CUSTOMER';\n    const orig = await ctx.get('transactions', invoiceId);\n    if (!orig || orig.type !== (cust ? TX_TYPE.SALE : TX_TYPE.PURCHASE)) throw new SalyError('NOT_FOUND', 'Invoice not found');\n    if (!Array.isArray(lines) || !lines.length) throw new SalyError('EMPTY_ORDER', 'Select at least one item');\n    const returned = {};\n    for (const t of await ctx.all('transactions')) {\n      if (t.refId === orig.id) for (const l of t.items) returned[l.sku] = round3((returned[l.sku] ?? 0) + l.quantity);\n    }\n    const out = [], seen = new Set();\n    let total = 0;\n    for (const ln of lines) {\n      if (seen.has(ln.sku)) throw new SalyError('INVALID_ORDER', 'Duplicate product in the return');\n      seen.add(ln.sku);\n      const src = orig.items.filter((l) => l.sku === ln.sku && !l.custom); // made-to-order items were never stocked\n      if (!src.length) throw new SalyError('NOT_FOUND', `Product ${ln.sku} is not returnable on this invoice`);\n      const qty = normQty(ln.quantity);\n      const left = round3(src.reduce((s, l) => s + l.quantity, 0) - (returned[ln.sku] ?? 0));\n      if (qty > left) throw new SalyError('RETURN_EXCEEDS', 'Return exceeds what is left on the invoice', { sku: ln.sku, left });\n      const base = src[0], unit = cust ? base.unitPrice : base.unitCost, lineTotal = Math.round(unit * qty);\n      total += lineTotal;\n      const p = await ctx.get('products', ln.sku);\n      if (!p) throw new SalyError('NOT_FOUND', `Product ${ln.sku} not found`);\n      let next;\n      if (cust) { // back to stock; cost re-averaged with the cost recorded on the sale line\n        const oldQty = Math.max(p.quantity, 0), cost = base.unitCost ?? p.purchasePrice;\n        next = { ...p, quantity: round3(p.quantity + qty), purchasePrice: Math.round((oldQty * p.purchasePrice + qty * cost) / (oldQty + qty)) };\n      } else {\n        if (p.quantity < qty) throw new SalyError('INSUFFICIENT_STOCK', `Not enough stock for ${p.produit}`, { sku: p.sku, available: p.quantity, requested: qty });\n        next = { ...p, quantity: round3(p.quantity - qty) };\n      }\n      await ctx.put('products', next);\n      out.push({ sku: p.sku, produit: base.produit, quantity: qty, ...(cust && { unitPrice: base.unitPrice }), unitCost: base.unitCost, lineTotal });\n    }\n    const store = cust ? 'debts' : 'receivables';\n    let debtPart = 0;\n    if (orig.settlement === SETTLEMENT.DEBT && orig.party) {\n      debtPart = Math.min(total, (await ctx.get(store, orig.party.phone))?.amount ?? 0);\n      if (debtPart > 0) await reduceOpenBalance(ctx, store, orig.party.phone, debtPart);\n    }\n    const cashPart = total - debtPart;\n    const type = cust ? TX_TYPE.CUSTOMER_RETURN : TX_TYPE.SUPPLIER_RETURN;\n    const tx = await journal(ctx, type, {\n      total, paid: cashPart, settlement: debtPart ? SETTLEMENT.DEBT : SETTLEMENT.CASH, party: orig.party, items: out, refId: orig.id,\n    });\n    if (cashPart) await ctx.cash(cust ? 'OUT' : 'IN', cashPart, type, tx.id);\n    return { transaction: tx };\n  });\n\n  /** Opening balance for a party: journaled with an invoice number, but no cash moves. */\n  const previousBalance = (store, type) => ({ nom, phone, amount }) => atomic(async (ctx) => {\n    assertMoney(amount, 'amount', { allowZero: false });\n    const party = normParty({ nom, phone });\n    const tx = await journal(ctx, type, { total: amount, paid: 0, settlement: SETTLEMENT.DEBT, party, note: 'previous balance' });\n    await addOpenBalance(ctx, store, party, amount);\n    return tx;\n  });\n\n  return Object.freeze({\n    customerReturn: makeReturn('CUSTOMER'),\n    supplierReturn: makeReturn('SUPPLIER'),\n\n    /** Expense: cash out with a mandatory description. No limit; the employee keeps the proof. */\n    expense: ({ amount, note }) => atomic(async (ctx) => {\n      assertMoney(amount, 'amount', { allowZero: false });\n      const text = String(note ?? '').trim();\n      if (!text) throw new SalyError('NOTE_REQUIRED', 'A description is required');\n      const tx = await journal(ctx, TX_TYPE.EXPENSE, { total: amount, paid: amount, note: text });\n      await ctx.cash('OUT', amount, TX_TYPE.EXPENSE, tx.id);\n      return tx;\n    }),\n\n    addPreviousDebt: previousBalance('debts', TX_TYPE.PREVIOUS_DEBT),\n    addPreviousReceivable: previousBalance('receivables', TX_TYPE.PREVIOUS_RECEIVABLE),\n\n    /** Create a product with the next sequential SKU (1, 2, 3 …); initial stock is journaled. */\n    addProduct: (data) => atomic(async (ctx) => {\n      const p = await createProduct(ctx, data);\n      await auditStock(ctx, [{ sku: p.sku, produit: p.produit, before: 0, after: p.quantity }], 'opening stock');\n      return p;\n    }),\n\n    /** Bulk add (CSV / Excel paste), all-or-nothing. Always creates NEW products. */\n    importProducts: (rows) => atomic(async (ctx) => {\n      if (!Array.isArray(rows) || !rows.length) throw new SalyError('EMPTY_IMPORT', 'Nothing to import');\n      const made = [];\n      for (const r of rows) made.push(await createProduct(ctx, r));\n      await auditStock(ctx, made.map((p) => ({ sku: p.sku, produit: p.produit, before: 0, after: p.quantity })), 'opening stock (import)');\n      return made.length;\n    }),\n\n    /** Owner edit. A quantity change is written to the journal (ADJUSTMENT) so stock cannot move silently. */\n    updateProduct: (sku, { sku: newSku, produit, purchasePrice, salePrice, quantity }) => atomic(async (ctx) => {\n      const p = await ctx.get('products', sku);\n      if (!p) throw new SalyError('NOT_FOUND', `Product ${sku} not found`);\n      const next = { ...p };\n      if (produit !== undefined) {\n        next.produit = String(produit).trim();\n        if (!next.produit) throw new SalyError('INVALID_PRODUCT', 'produit is required');\n      }\n      if (purchasePrice !== undefined) next.purchasePrice = assertMoney(purchasePrice, 'purchasePrice');\n      if (salePrice !== undefined) next.salePrice = assertMoney(salePrice, 'salePrice');\n      if (quantity !== undefined) {\n        const q = round3(Number(quantity));\n        if (!Number.isFinite(q) || q < 0) throw new SalyError('INVALID_QUANTITY', 'quantity must be >= 0');\n        next.quantity = q;\n      }\n      const renamed = newSku !== undefined && Number(newSku) !== sku;\n      if (renamed) { next.sku = await checkFreeSku(ctx, newSku); await ctx.del('products', sku); (await ctx.usedSkus()).delete(sku); }\n      const saved = await ctx.put('products', next);\n      await auditStock(ctx, [{ sku: next.sku, produit: next.produit, before: p.quantity, after: next.quantity }], 'manual adjustment');\n      if (renamed) await journal(ctx, TX_TYPE.ADJUSTMENT, { items: [{ sku: next.sku, produit: next.produit, previousSku: sku }], note: 'sku change' });\n      return saved;\n    }),\n\n    /**\n     * items: [{ sku, quantity, unitPrice? }] or made-to-order [{ custom:{produit,purchasePrice,salePrice}, quantity?, unitPrice? }]   paid: minor units   customer: { nom, phone } (only if paid < total)\n     * The engine — not the UI — decides CASH or DEBT.\n     */\n    sale: ({ items, paid, customer }) => atomic(async (ctx) => {\n      needItems(items);\n      const lines = [];\n      let total = 0;\n      let customCost = 0; // made-to-order items: bought outside inventory, cost leaves the cash box\n      for (const it of items) {\n        if (it.custom) {\n          const produit = String(it.custom.produit ?? '').trim();\n          if (!produit) throw new SalyError('INVALID_PRODUCT', 'produit is required');\n          const quantity = normQty(it.quantity ?? 1);\n          const unitCost = assertMoney(it.custom.purchasePrice, 'purchasePrice');\n          const unitPrice = assertMoney(it.unitPrice ?? it.custom.salePrice, 'salePrice');\n          const lineTotal = Math.round(unitPrice * quantity);\n          total += lineTotal;\n          customCost += Math.round(unitCost * quantity);\n          lines.push({ sku: null, custom: true, produit, quantity, unitPrice, unitCost, lineTotal });\n          continue;\n        }\n        const p = await ctx.get('products', it.sku);\n        if (!p) throw new SalyError('NOT_FOUND', `Product ${it.sku} not found`);\n        const quantity = normQty(it.quantity);\n        if (p.quantity < quantity) {\n          throw new SalyError('INSUFFICIENT_STOCK', `Not enough stock for ${p.produit}`, { sku: p.sku, available: p.quantity, requested: quantity });\n        }\n        const unitPrice = assertMoney(it.unitPrice ?? p.salePrice, 'unitPrice');\n        const lineTotal = Math.round(unitPrice * quantity);\n        total += lineTotal;\n        lines.push({ sku: p.sku, produit: p.produit, quantity, unitPrice, unitCost: p.purchasePrice, lineTotal });\n        await ctx.put('products', { ...p, quantity: round3(p.quantity - quantity) });\n      }\n\n      const d = decideSettlement(total, paid);\n      const party = d.openAmount > 0 ? normParty(customer) : null;\n      const tx = await journal(ctx, TX_TYPE.SALE, { total, paid: d.cashAmount, settlement: d.settlement, party, items: lines });\n      await ctx.cash('IN', d.cashAmount, TX_TYPE.SALE, tx.id);\n      await ctx.cash('OUT', customCost, 'CUSTOM_ORDER_COST', tx.id);\n      if (party) await addOpenBalance(ctx, 'debts', party, d.openAmount);\n      return { transaction: tx, change: d.change };\n    }),\n\n    /**\n     * items: [{ sku, quantity, purchasePrice, salePrice? }] or\n     *        [{ new: { sku?, produit, salePrice }, quantity, purchasePrice }]  (creates the product)\n     * supplier: { nom, phone } (always required). paid may not exceed the total.\n     */\n    purchase: ({ items, paid, supplier }) => atomic(async (ctx) => {\n      needItems(items);\n      const lines = [];\n      let total = 0;\n      for (const it of items) {\n        const quantity = normQty(it.quantity);\n        const purchasePrice = assertMoney(it.purchasePrice, 'purchasePrice');\n        let p, isNew = false;\n        if (it.new) {\n          const produit = String(it.new.produit ?? '').trim();\n          if (!produit) throw new SalyError('INVALID_PRODUCT', 'produit is required');\n          const wanted = it.new.sku;\n          const sku = wanted === undefined || wanted === null || wanted === '' ? await ctx.nextSku() : await checkFreeSku(ctx, wanted);\n          p = { sku, produit, purchasePrice, salePrice: assertMoney(it.new.salePrice, 'salePrice'), quantity: 0 };\n          isNew = true;\n        } else {\n          p = await ctx.get('products', it.sku);\n          if (!p) throw new SalyError('NOT_FOUND', `Product ${it.sku} not found`);\n        }\n        const before = { purchasePrice: p.purchasePrice, salePrice: p.salePrice };\n        // weighted-average cost; negative stock counts as 0\n        const oldQty = Math.max(p.quantity, 0);\n        const avgCost = isNew ? purchasePrice : Math.round((oldQty * p.purchasePrice + quantity * purchasePrice) / (oldQty + quantity));\n        const newSale = it.salePrice !== undefined ? assertMoney(it.salePrice, 'salePrice') : p.salePrice;\n        const lineTotal = Math.round(purchasePrice * quantity);\n        total += lineTotal;\n        // the invoice keeps every price change so nothing moves silently\n        lines.push({\n          sku: p.sku, produit: p.produit, quantity, unitCost: purchasePrice, lineTotal,\n          ...(isNew && out the expected amount.\n     */\n    closeCash: ({ counted }) => atomic(async (ctx) => {\n      assertMoney(counted, 'counted');\n      const expected = await ctx.meta('cashBalance', 0);\n      const difference = counted - expected;\n      const tx = await journal(ctx, TX_TYPE.CASH_CLOSING, {\n        total: counted, paid: counted, items: [{ expected, counted, difference }],\n        note: difference === 0 ? 'no difference' : difference < 0 ? 'shortage' : 'overage',\n      });\n      if (difference) await ctx.cash(difference > 0 ? 'IN' : 'OUT', Math.abs(difference), 'CLOSING_DIFFERENCE', tx.id);\n      await ctx.setMeta('lastClosing', { at: ctx.now, expected, counted, difference, txId: tx.id });\n      return { closedAt: ctx.now };\n    }),\n\n    /** A customer pays part or all of what they owe. */\n    collectDebt: ({ phone, amount }) => atomic(async (ctx) => {\n      assertMoney(amount, 'amount', { allowZero: false });\n      const debt = await reduceOpenBalance(ctx, 'debts', phone, amount);\n      const tx = await journal(ctx, TX_TYPE.DEBT_PAYMENT, {\n        total: amount, paid: amount, party: { nom: debt.nom, phone: debt.phone },\n      });\n      await ctx.cash('IN', amount, TX_TYPE.DEBT_PAYMENT, tx.id);\n      return tx;\n    }),\n\n    /** We pay part or all of what we owe a supplier. */\n    payReceivable: ({ phone, amount }) => atomic(async (ctx) => {\n      assertMoney(amount, 'amount', { allowZero: false });\n      const rec = await reduceOpenBalance(ctx, 'receivables', phone, amount);\n      const tx = await journal(ctx, TX_TYPE.RECEIVABLE_PAYMENT, {\n        total: amount, paid: amount, party: { nom: rec.nom, phone: rec.phone },\n      });\n      await ctx.cash('OUT', amount, TX_TYPE.RECEIVABLE_PAYMENT, tx.id);\n      return tx;\n    }),\n\n    saveSettings: (patch) => atomic(async (ctx) => {\n      const cur = { ...DEFAULT_SETTINGS, ...(await ctx.meta('settings', {})) };\n      for (const k of Object.keys(DEFAULT_SETTINGS)) if (patch[k] !== undefined) cur[k] = String(patch[k]).trim();\n      cur.countryCode = normPhone(cur.countryCode);\n      if (!cur.storeName) throw new SalyError('INVALID_SETTINGS', 'storeName is required');\n      await ctx.setMeta('settings', cur);\n      return cur;\n    }),\n\n    /** Sets or changes the admin PIN (hashed, 4–12 digits). Hashing happens before the transaction opens. */\n    setAdminPin: async (newPin, currentPin) => {\n      if (!/^\\d{4,12}$/.test(String(newPin))) throw new SalyError('INVALID_PIN', 'PIN must be 4–12 digits');\n      const cur = (await req(db.transaction('meta').objectStore('meta').get('adminPin')))?.value;\n      if (cur && (await hashPin(String(currentPin ?? ''), cur.salt)) !== cur.hash) throw new SalyError('WRONG_PIN', 'Wrong PIN');\n      const salt = newId(deviceId);\n      const rec = { salt, hash: await hashPin(String(newPin), salt) };\n      return atomic(async (ctx) => { await ctx.setMeta('adminPin', rec); });\n    },\n\n    /** Runs pending data migrations (see MIGRATIONS). Called by openSaly(). */\n    migrate: () => atomic(async (ctx) => {\n      const done = await ctx.meta('schemaVersion', 0);\n      for (let i = done; i < MIGRATIONS.length; i++) await MIGRATIONS[i](ctx);\n      if (done < MIGRATIONS.length) await ctx.setMeta('schemaVersion', MIGRATIONS.length);\n    }),\n\n    recordBackup: () => atomic(async (ctx) => { await ctx.setMeta('lastBackup', Date.now()); }),\n\n    /** Replaces ALL data on this device with a backup file. Needs the current admin PIN (when one is set). */\n    restoreBackup: async (backup, pin) => {\n      const d = backup?.data;\n      const keys = { products: 'sku', cashbox: 'id', debts: 'phone', receivables: 'phone', transactions: 'id', meta: 'key' };\n      if (backup?.format !== 'saly-backup' || backup.version !== 1 || !d\n        || Object.entries(keys).some(([st, k]) => !Array.isArray(d[st]) || d[st].some((r) => r?.[k] === undefined))) {\n        throw new SalyError('INVALID_BACKUP', 'Not a valid saly backup file');\n      }\n      const cur = (await req(db.transaction('meta').objectStore('meta').get('adminPin')))?.value;\n      if (cur && (await hashPin(String(pin ?? ''), cur.salt)) !== cur.hash) throw new SalyError('WRONG_PIN', 'Wrong PIN');\n      return atomic(async (ctx) => {\n        for (const st of ['products', 'cashbox', 'debts', 'receivables', 'transactions', 'outbox']) await ctx.clear(st);\n        const mine = await ctx.get('meta', 'deviceId');\n        await ctx.clear('meta');\n        if (mine) await ctx.raw('meta', mine);\n        for (const st of Object.keys(keys)) for (const r of d[st]) if (!(st === 'meta' && r.key === 'deviceId')) await ctx.raw(st, r);\n        return Object.fromEntries(Object.keys(keys).map((st) => [st, d[st].length]));\n      });\n    },\n\n    /**\n     * Remise à zéro: wipes cash box, debts, receivables and the journal (so invoices too).\n     * KEPT: products (inventory), settings, admin PIN, device id and SKU counter. Requires the admin PIN.\n     */\n    resetData: async (pin) => {\n      const rec = (await req(db.transaction('meta').objectStore('meta').get('adminPin')))?.value;\n      if (!rec || (await hashPin(String(pin ?? ''), rec.salt)) !== rec.hash) throw new SalyError('WRONG_PIN', 'Wrong PIN');\n      const wiped = ['cashbox', 'debts', 'receivables', 'transactions'];\n      return atomic(async (ctx) => {\n        for (const st of wiped) await ctx.clear(st);\n        await ctx.purgeOutbox(wiped);\n        await ctx.purgeMeta('invoiceSeq:');\n        await ctx.purgeMeta('lastClosing');\n        await ctx.setMeta('cashBalance', 0);\n      });\n    },\n\n    /** Called by the WhatsApp notifier after it tried to send. */\n    setNotificationStatus: (phone, status) => atomic(async (ctx) => {\n      if (!Object.values(NOTIFICATION).includes(status)) throw new SalyError('INVALID_STATUS', `Unknown status ${status}`);\n      const debt = await ctx.get('debts', normPhone(phone));\n      if (!debt) throw new SalyError('NOT_FOUND', 'No debt for this phone number');\n      return ctx.put('debts', { ...debt, notification: status, ...(status === NOTIFICATION.SENT && { remindedAt: ctx.now }) });\n    }),\n\n    /* ── Sync hooks ── */\n\n    /** After the server acknowledged these outbox entries. */\n    markSynced: (seqs) => acknowledge(db, seqs),\n\n    /**\n     * Apply changes received from the server (not re-queued to the outbox).\n     * Mutable tables: last-writer-wins on _sync.updatedAt (ties broken by deviceId).\n     * Ledgers: insert-if-absent (append-only); remote cash rows also adjust the local balance.\n     */\n    applyRemoteChanges: (changes) => atomic(async (ctx) => {\n      const newer = (a, b) =>\n        a._sync.updatedAt > b._sync.updatedAt ||\n        (a._sync.updatedAt === b._sync.updatedAt && a._sync.deviceId > b._sync.deviceId);\n\n      for (const { store, record, op, key: delKey } of changes) {\n        if (op === 'delete') { await ctx.del(store, delKey, { track: false }); continue; }\n        const key = record[store === 'products' ? 'sku' : store === 'debts' || store === 'receivables' ? 'phone' : 'id'];\n        const local = await ctx.get(store, key);\n\n        const appendOnly = store === 'cashbox' || store === 'transactions';\n        if (appendOnly ? local : local && !newer(record, local)) continue;\n\n        // keepStamp: preserve the remote _sync stamp so last-writer-wins stays stable\n        await ctx.put(store, record, { track: false, keepStamp: true });\n\n        if (store === 'cashbox') {\n          const bal = await ctx.meta('cashBalance', 0);\n          await ctx.setMeta('cashBalance', record.direction === 'IN' ? bal + record.amount : bal - record.amount);\n        }\n      }\n    }),\n  });\n}\n\n/* ───────────────────────── Public entry point ───────────────────────── */\n\n/**\n * const { read, engine } = await openSaly();\n * await engine.addProduct({ produit: 'Marteau', purchasePrice: 4000, salePrice: 6000, quantity: 10 });\n * await engine.deposit({ amount: 50000, note: 'opening float' });\n * const { transaction, change } = await engine.sale({ items: [{ sku: 1, quantity: 2 }], paid: 12000 });\n * await engine.sale({ items: [{ sku: 1, quantity: 1 }], paid: 2000, customer: { nom: 'Ali', phone: '0612345678' } }); // → DEBT\n */\nasync function openSaly() {\n  const db = await openDatabase();\n\n  // one-time device identity (used in ids and sync stamps)\n  const tx = db.transaction('meta', 'readwrite');\n  const store = tx.objectStore('meta');\n  let rec = await req(store.get('deviceId'));\n  if (!rec) {\n    rec = { key: 'deviceId', value: Math.random().toString(36).slice(2, 10) };\n    await req(store.put(rec));\n  }\n  const deviceId = rec.value;\n\n  const engine = createEngine(db, deviceId);\n  await engine.migrate();\n  return { read: createReadAPI(db), engine, deviceId };\n}\n\nasync function acknowledge(db, seqs) {\n  const tx = db.transaction('outbox', 'readwrite');\n  const store = tx.objectStore('outbox');\n  for (const seq of seqs) await req(store.delete(seq));\n}\n\n/* saly-ui.js — helpers shared by every screen (no business logic here) */\nconst $ = (s) => document.querySelector(s);\nconst esc = (s) => String(s).replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst latin = (s) => String(s).replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, (d) => d.charCodeAt(0) - 0x6f0).replace(/[،,]/g, '.');\nconst num = (s) => { const n = parseFloat(latin(s).trim()); return Number.isFinite(n) ? n : NaN; };\nconst digits = (s) => latin(s).replace(/\\D/g, ''); // phone numbers typed with Arabic-Indic digits work too\nconst fmt = (m) => { const v = m / 100; return Number.isInteger(v) ? v.toLocaleString('en-US') : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };\nconst fmtQty = (q) => q.toLocaleString('en-US', { maximumFractionDigits: 3 });\nconst MONTHS = ['jan', 'fév', 'mar', 'avr', 'mai', 'juin', 'juil', 'août', 'sep', 'oct', 'nov', 'déc'];\nconst smallestFree = (used) => { let n = 1; while (used.has(n)) n++; return n; };\nconst pad = (n) => String(n).padStart(2, '0');\n\nconst CONFIG = { ...DEFAULT_SETTINGS }; // filled from the engine's settings at boot()\n\nconst ERRORS = {\n  INSUFFICIENT_STOCK: (e) => `الكمية غير كافية في المخزون (المتوفر: ${e.details?.available})`,\n  SKU_EXISTS: (e) => `الرقم مستعمل: ${e.details?.product?.produit ?? ''}`,\n  INVALID_SKU: () => 'الرقم يجب أن يكون عدداً صحيحاً موجباً',\n  PARTY_REQUIRED: () => 'الاسم والهاتف (6 أرقام على الأقل) مطلوبان',\n  INVALID_BACKUP: () => 'ملف النسخة الاحتياطية غير صالح',\n  NOTE_REQUIRED: () => 'الوصف مطلوب',\n  RETURN_EXCEEDS: (e) => `الكمية أكبر من المتبقي في الفاتورة (المتبقي: ${e.details?.left})`,\n  OVERPAYMENT: () => 'المبلغ المدفوع أكبر من قيمة الفاتورة',\n  NOT_FOUND: () => 'العنصر غير موجود',\n  WRONG_PIN: () => 'الرمز السري الحالي غير صحيح',\n  INVALID_PIN: () => 'الرمز السري: من 4 إلى 12 رقماً',\n  INVALID_SETTINGS: () => 'اسم المحل مطلوب',\n  INVALID_QUANTITY: () => 'الكمية غير صحيحة',\n};\nconst errText = (e) => (ERRORS[e.code] ? ERRORS[e.code](e) : e.message || 'حدث خطأ');\n\nlet toastTimer;\nfunction toast(msg, ok = false) {\n  const t = $('#toast'); t.textContent = msg; t.className = ok ? 'okt' : ''; t.style.display = 'block';\n  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), 3800);\n}\nfunction modal(html) {\n  const m = document.createElement('div'); m.className = 'ov';\n  m.innerHTML = `<div class=\"box\">${html}<\/div>`;\n  m.addEventListener('click', (e) => { if (e.target === m && m.dismissable !== false) m.remove(); });\n  document.body.append(m);\n  return m;\n}\n\n/* the field being typed in is moved into the UPPER part of the screen, above the on-screen keyboard\n   (fields inside pop-ups are already there: pop-ups are drawn in the top half) */\ndocument.addEventListener('focusin', (e) => {\n  const el = e.target;\n  if (!el.matches?.('input, textarea, select') || el.closest('.ov')) return;\n  document.body.classList.add('typing');\n  setTimeout(() => {\n    const top = el.getBoundingClientRect().top;\n    if (top > innerHeight * 0.35 || top < 0) scrollBy({ top: top - innerHeight * 0.18, behavior: 'smooth' });\n  }, 280); // after the keyboard has opened\n});\ndocument.addEventListener('focusout', () => setTimeout(() => {\n  if (!document.activeElement?.matches?.('input, textarea, select')) document.body.classList.remove('typing');\n}, 120));\n\n/* unified header: logo (right) · title (center) · back (left) */\nlet backFn = () => (parent.__back ? parent.__back() : history.back());\nconst onBack = (fn) => { backFn = fn || (() => (parent.__back ? parent.__back() : history.back())); };\nconst setTitle = (t) => { $('#title').textContent = t; document.title = 'saly — ' + t; };\n$('#back')?.addEventListener('click', () => backFn());\n\nasync function boot() {\n  try {\n    const s = await openSaly();\n    Object.assign(CONFIG, await s.read.getSettings());\n    return s;\n  } catch (err) { toast('تعذر فتح قاعدة البيانات: ' + (err.message || err)); throw err; }\n}\n\nfunction download(name, text, type = 'text/csv;charset=utf-8', bom = true) {\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([bom ? '\\ufeff' + text : text], { type }));\n  a.download = name; document.body.append(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n}\n\n/* saly-invoice.js — operation names, invoice details and WhatsApp text/link (used by the archive and the sale screen) */\nconst OPS = {\n  SALE: 'بيع', PURCHASE: 'شراء', DEBT_PAYMENT: 'تحصيل دين', RECEIVABLE_PAYMENT: 'تسديد مورد',\n  WITHDRAWAL: 'سحب', DEPOSIT: 'إيداع', PREVIOUS_DEBT: 'دين سابق', PREVIOUS_RECEIVABLE: 'مستحق سابق',\n  EXPENSE: 'مصروف', CUSTOMER_RETURN: 'إرجاع من زبون', SUPPLIER_RETURN: 'إرجاع للمورد',\n};\nconst opName = (t) => OPS[t] ?? t;\nconst hhmm = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };\nconst fullDate = (ts) => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${hhmm(ts)}`; };\nconst isGoods = (tx) => ['SALE', 'PURCHASE', 'CUSTOMER_RETURN', 'SUPPLIER_RETURN'].includes(tx.type);\nconst isReturn = (tx) => tx.type === 'CUSTOMER_RETURN' || tx.type === 'SUPPLIER_RETURN';\nconst unitOf = (tx, l) => (tx.type === 'SALE' || tx.type === 'CUSTOMER_RETURN' ? l.unitPrice : l.unitCost);\nconst hasNote = (tx) => !!tx.note && ['WITHDRAWAL', 'DEPOSIT', 'EXPENSE'].includes(tx.type);\n/** Labels for the money part of goods invoices (paid / debt for sale & purchase, cash back / debt cut for returns). */\nconst moneyLabels = (tx) => ({\n  SALE: ['المدفوع', 'دين الزبون'], PURCHASE: ['المدفوع', 'دين للمورد'],\n  CUSTOMER_RETURN: ['أُعيد نقداً', 'خُصم من دين الزبون'], SUPPLIER_RETURN: ['استُرد نقداً', 'خُصم من دين المورد'],\n}[tx.type]);\n\n/** Plain-text invoice for WhatsApp (layout follows the shop's reference message). */\nfunction invoiceText(tx) {\n  const d = new Date(tx.timestamp), sep = '------------------------------', cur = CONFIG.currency;\n  const head = [`*${CONFIG.storeName}*`, '', sep, `Fact n°: ${tx.no ?? '—'}`,\n    `Date: ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}  Heure: ${hhmm(tx.timestamp)}`, `Opération: ${opName(tx.type)}`, sep];\n  const tail = [sep, ...(CONFIG.phone ? [`Tel: ${CONFIG.phone}`] : []), ...(CONFIG.address ? [`Adresse: ${CONFIG.address}`] : []), sep, '', CONFIG.thanks];\n  let body;\n  if (isGoods(tx)) {\n    const items = tx.items.map((l, i) => `${i + 1}. ${l.produit}\\n${l.quantity}×${fmt(unitOf(tx, l))}   ${fmt(l.lineTotal)}`);\n    const qty = tx.items.reduce((s, l) => s + l.quantity, 0);\n    body = [...items, sep, `Nombre des articles: ${qty}`, '', `*Montant total: ${fmt(tx.total)} ${cur}*`,\n      ...(isReturn(tx) ? ['', `${moneyLabels(tx)[0]}: ${fmt(tx.paid)}`, ...(tx.total > tx.paid ? [`${moneyLabels(tx)[1]}: ${fmt(tx.total - tx.paid)}`] : []), '']\n        : tx.settlement === 'DEBT' ? ['', `المدفوع: ${fmt(tx.paid)}`, `الباقي: ${fmt(tx.total - tx.paid)}`, ''] : [])];\n  } else {\n    body = [...(tx.party ? [`${tx.party.nom}`, ''] : []), `*Montant: ${fmt(tx.total)} ${cur}*`,\n      ...(hasNote(tx) ? ['', tx.note] : [])];\n  }\n  return [...head, ...body, ...tail].join('\\n');\n}\n\nfunction waNumber(raw) {\n  let n = digits(raw);\n  if (n.startsWith('00')) n = n.slice(2); else if (n.startsWith('0')) n = CONFIG.countryCode + n.slice(1);\n  return n.length >= 8 ? n : null;\n}\n/** One tap: with a phone number → straight to that chat; without → WhatsApp's own contact chooser. */\nfunction openWhatsApp(tx, raw = tx.party?.phone ?? '') {\n  const text = encodeURIComponent(invoiceText(tx)), typed = String(raw).trim();\n  if (!typed) return window.open(`https://wa.me/?text=${text}`, '_blank');\n  const n = waNumber(typed);\n  if (!n) return toast('رقم واتساب غير صحيح');\n  window.open(`https://wa.me/${n}?text=${text}`, '_blank');\n}\n\n/** Full invoice details; `mods` = later operations linked to this invoice (returns). */\nfunction detailsHtml(tx, mods = []) {\n  const cur = CONFIG.currency, kv = (k, v, c = '') => `<div class=\"kv\"><span>${k}<\/span><b class=\"${c}\">${v}<\/b><\/div>`;\n  let h = kv('العملية', opName(tx.type)) + kv('التاريخ', `<bdi>${fullDate(tx.timestamp)}<\/bdi>`);\n  if (tx.party) h += kv('الطرف', `${esc(tx.party.nom)} · <bdi>${esc(tx.party.phone)}<\/bdi>`);\n  if (isGoods(tx)) {\n    h += tx.items.map((l) => {\n      let x = '';\n      if (l.custom) x += `<small class=\"dl\">حسب الطلب · شراء ${fmt(l.unitCost)} · عمولة ${fmt(Math.round((l.unitPrice - l.unitCost) * l.quantity))}<\/small>`;\n      if (l.isNew) x += '<small class=\"dl\">منتج جديد<\/small>';\n      if (l.previousPurchasePrice !== undefined) x += `<small class=\"dl\">سعر الشراء: ${fmt(l.previousPurchasePrice)} ← ${fmt(l.newPurchasePrice)}<\/small>`;\n      if (l.previousSalePrice !== undefined) x += `<small class=\"dl\">سعر البيع: ${fmt(l.previousSalePrice)} ← ${fmt(l.newSalePrice)}<\/small>`;\n      return `<div class=\"il\"><div><b>${esc(l.produit)}<\/b>${x}<\/div><div class=\"ilr\"><span>${fmtQty(l.quantity)} × ${fmt(unitOf(tx, l))}<\/span><b>${fmt(l.lineTotal)}<\/b><\/div><\/div>`;\n    }).join('');\n    h += kv('عدد القطع', fmtQty(tx.items.reduce((s, l) => s + l.quantity, 0)))\n      + kv(isReturn(tx) ? 'إجمالي المرتجع' : 'الإجمالي', `${fmt(tx.total)} ${cur}`, 'gl') + kv(moneyLabels(tx)[0], fmt(tx.paid));\n    if (tx.settlement === 'DEBT') h += kv(moneyLabels(tx)[1], fmt(tx.total - tx.paid), 'dbt');\n  } else h += kv('المبلغ', `${fmt(tx.total)} ${cur}`, 'gl');\n  if (hasNote(tx)) h += kv(tx.type === 'EXPENSE' ? 'الوصف' : 'ملاحظة', esc(tx.note));\n  if (mods.length) { // every later return on this invoice, with its items, and the net\n    h += `<h3 class=\"mh\">التعديلات (معدلة)<\/h3>` + mods.map((m) => kv(`${opName(m.type)} ${m.no ?? ''}`, `<bdi>${fullDate(m.timestamp)}<\/bdi> · ${fmt(m.total)}`)\n      + `<small class=\"dl\">${m.items.map((l) => `${esc(l.produit)} × ${fmtQty(l.quantity)}`).join(' ، ')}<\/small>`).join('');\n    h += kv('الصافي بعد الإرجاع', `${fmt(tx.total - mods.reduce((s, m) => s + m.total, 0))} ${cur}`, 'gl');\n  }\n  return h;\n}\n\nconst WA_ICON = '<svg viewBox=\"0 0 24 24\" width=\"30\" height=\"30\" aria-hidden=\"true\"><path d=\"M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z\" fill=\"#25D366\"/><path d=\"M8.5 7.5c-.3 0-.8.1-1 .6-.3.7-.3 1.9.9 3.6 1.3 1.9 2.8 2.9 4.5 3.4 1 .3 1.8.1 2.2-.4.2-.3.3-.6.2-.8l-1.6-.8c-.2-.1-.4 0-.5.1l-.5.6c-.1.1-.3.2-.5.1-.6-.3-1.7-1-2.4-2.2-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.4 0-.5l-.7-1.6c-.1-.2-.3-.3-.5-.3z\" fill=\"#fff\"/><\/svg>';\nconst shortDate = (ts) => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };\n\n/** Debt reminder for a customer (the amount is what is still open). */\nfunction reminderText(d) {\n  return [`*${CONFIG.storeName}*`, '', `السلام عليكم ${d.nom}،`, `نذكّركم بأن المبلغ المتبقي عليكم هو *${fmt(d.amount)} ${CONFIG.currency}*.`,\n    'نرجو تسوية ذلك في أقرب وقت.', ...(CONFIG.phone ? ['', `Tel: ${CONFIG.phone}`] : []), '', CONFIG.thanks].join('\\n');\n}\n/** Opens the customer's WhatsApp chat with the reminder ready to send. */\nfunction openReminder(d) {\n  const n = waNumber(d.phone);\n  if (!n) { toast('رقم واتساب غير صحيح'); return false; }\n  window.open(`https://wa.me/${n}?text=${encodeURIComponent(reminderText(d))}`, '_blank');\n  return true;\n}\n\n/* saly-parties.js — customer debts / supplier receivables screen (same layout, different engine calls) */\nconst PARTY = {\n  debts: { total: 'إجمالي الديون', add: '+ إضافة دين سابق', empty: 'لا ديون مسجلة', addTitle: 'إضافة دين سابق', payBtn: 'تحصيل', get: 'getDebts', pay: 'collectDebt', addOp: 'addPreviousDebt', who: 'اسم الزبون' },\n  receivables: { total: 'إجمالي المستحقات', add: '+ إضافة مستحق سابق', empty: 'لا مستحقات مسجلة', addTitle: 'إضافة مستحق سابق', payBtn: 'تسديد', get: 'getReceivables', pay: 'payReceivable', addOp: 'addPreviousReceivable', who: 'اسم المورد' },\n};\n\nfunction mountParties({ read, engine, kind, root }) {\n  const K = PARTY[kind];\n  const field = 'width:100%;margin-bottom:10px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:17px';\n  root.innerHTML = `<input id=\"q\" type=\"search\" autocomplete=\"off\" placeholder=\"بحث بالاسم أو الهاتف\">\n    <div class=\"sum\"><span>${K.total}<\/span><b id=\"sumv\">0<\/b><\/div>\n    <button class=\"wide\" id=\"addp\">${K.add}<\/button><div class=\"pl\" id=\"pl\"><\/div>`;\n  let rows = [];\n\n  async function render() {\n    rows = (await read[K.get]()).sort((a, b) => b.amount - a.amount); // biggest balance first\n    $('#sumv').textContent = fmt(rows.reduce((s, r) => s + r.amount, 0));\n    const q = latin($('#q').value).trim().toLowerCase(), dq = q.replace(/\\D/g, '');\n    const shown = q ? rows.filter((r) => r.nom.toLowerCase().includes(q) || (dq && r.phone.includes(dq))) : rows;\n    $('#pl').innerHTML = shown.length\n      ? shown.map((r) => `<div class=\"pi\" data-phone=\"${esc(r.phone)}\"><div><b>${esc(r.nom)}<\/b><small>${esc(r.phone)}${r.remindedAt ? ' · آخر تذكير ' + shortDate(r.remindedAt) : ''}<\/small><\/div>\n          <span class=\"amt\">${fmt(r.amount)}<\/span>${kind === 'debts' ? `<button class=\"wa\" data-wa aria-label=\"تذكير واتساب\">${WA_ICON}<\/button>` : ''}<\/div>`).join('')\n      : `<div class=\"empty\">${rows.length ? 'لا توجد نتائج' : K.empty}<\/div>`;\n  }\n  $('#q').addEventListener('input', render);\n  render();\n\n  /* settle part or all of a balance (cash moves inside the engine) */\n  $('#pl').addEventListener('click', (e) => {\n    const el = e.target.closest('.pi'); if (!el) return;\n    const r = rows.find((x) => x.phone === el.dataset.phone); if (!r) return;\n    const remind = async () => { // one tap: chat opens with the reminder; the engine records that this customer was reminded\n      if (!openReminder(r)) return;\n      try { await engine.setNotificationStatus(r.phone, 'SENT'); render(); } catch (err) { toast(errText(err)); }\n    };\n    if (e.target.closest('[data-wa]')) return remind();\n    const m = modal(`<h2>${esc(r.nom)}<\/h2>\n      <div class=\"kv\"><span>الهاتف<\/span><b>${esc(r.phone)}<\/b><\/div>\n      <div class=\"kv\"><span>المتبقي<\/span><b class=\"dbt\">${fmt(r.amount)} ${CONFIG.currency}<\/b><\/div>\n      <input id=\"pa\" inputmode=\"decimal\" placeholder=\"المبلغ\" style=\"${field};margin-top:12px\">\n      <div class=\"btns\" style=\"margin:0 0 10px\"><button class=\"btn\" data-full>كامل المبلغ<\/button><\/div>\n      <div class=\"hint\" id=\"ph\"><\/div>\n      ${kind === 'debts' ? '<div class=\"btns\" style=\"margin:0 0 10px\"><button class=\"btn\" data-remind>تذكير عبر واتساب<\/button><\/div>' : ''}\n      <div class=\"btns\"><button class=\"btn\" data-c>إغلاق<\/button><button class=\"btn p\" data-ok>${K.payBtn}<\/button><\/div>`);\n    m.querySelector('[data-remind]')?.addEventListener('click', remind);\n    const pa = m.querySelector('#pa'), ph = m.querySelector('#ph'), ok = m.querySelector('[data-ok]');\n    const amount = () => { const v = num(pa.value); return Number.isFinite(v) && v > 0 ? Math.round(v * 100) : null; };\n    const update = () => {\n      const a = amount(); ok.disabled = a === null || a > r.amount;\n      ph.className = 'hint ' + (a !== null && a <= r.amount ? 'ok' : 'dbt');\n      ph.textContent = a === null ? '' : a > r.amount ? 'المبلغ أكبر من المتبقي' : `المتبقي بعد العملية: ${fmt(r.amount - a)} ${CONFIG.currency}`;\n    };\n    pa.addEventListener('input', update); pa.focus(); update();\n    m.querySelector('[data-full]').onclick = () => { pa.value = r.amount / 100; update(); };\n    m.querySelector('[data-c]').onclick = () => m.remove();\n    ok.onclick = async () => {\n      ok.disabled = true;\n      try { const tx = await engine[K.pay]({ phone: r.phone, amount: amount() }); m.remove(); toast(`تمت العملية · فاتورة ${tx.no}`, true); render(); }\n      catch (err) { ok.disabled = false; toast(errText(err)); }\n    };\n  });\n\n  /* balance that existed before saly: recorded and numbered, but no cash moves */\n  $('#addp').addEventListener('click', () => {\n    const m = modal(`<h2>${K.addTitle.replace('إضافة ', '')}<\/h2>\n      <input id=\"an\" placeholder=\"${K.who}\" style=\"${field}\">\n      <input id=\"ap\" inputmode=\"tel\" placeholder=\"الهاتف\" style=\"${field}\">\n      <input id=\"am\" inputmode=\"decimal\" placeholder=\"المبلغ\" style=\"${field}\">\n      <div class=\"hint dbt\" id=\"ah\"><\/div>\n      <div class=\"btns\"><button class=\"btn\" data-c>إلغاء<\/button><button class=\"btn p\" data-ok>إضافة<\/button><\/div>`);\n    const [an, ap, am] = ['#an', '#ap', '#am'].map((s) => m.querySelector(s)), ah = m.querySelector('#ah');\n    an.focus();\n    ap.addEventListener('input', () => { // same phone = same party: say so instead of merging silently\n      const d = digits(ap.value), ex = rows.find((x) => x.phone === d);\n      ah.textContent = ex ? `⚠ هذا الرقم مسجل باسم ${ex.nom} (${fmt(ex.amount)}) — سيُضاف المبلغ إلى رصيده` : '';\n    });\n    m.querySelector('[data-c]').onclick = () => m.remove();\n    m.querySelector('[data-ok]').onclick = async (ev) => {\n      const v = num(am.value);\n      if (!an.value.trim() || digits(ap.value).length < 6 || !(v > 0)) return toast('أدخل الاسم والهاتف (6 أرقام على الأقل) والمبلغ');\n      ev.target.disabled = true;\n      try { const tx = await engine[K.addOp]({ nom: an.value, phone: ap.value, amount: Math.round(v * 100) }); m.remove(); toast(`تمت الإضافة · فاتورة ${tx.no}`, true); render(); }\n      catch (err) { ev.target.disabled = false; toast(errText(err)); }\n    };\n  });\n}\n\n/* customer debts / supplier receivables: layout and flow are shared, only the kind differs */\nconst KIND = 'debts';\nsetTitle(KIND === 'debts' ? 'ديون الزبناء' : 'مستحقات الموردين');\ntry { const { read, engine } = await boot(); mountParties({ read, engine, kind: KIND, root: $('#view') }); } catch { /* error already shown */ }\n\n<\/script><\/body><\/html>\n", "receivables": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>saly<\/title><style>/* saly theme — palette derived from the logo: royal blue + gold, lime-green for the action */\n:root{--bg:#040a1f;--panel:#0b1a52;--panel2:#0d1f66;--line:#1d3a9e;--glow:#2f6bff;--glow-rgb:47,107,255;\n--gold:#f6b92b;--gold2:#ffe08a;--txt:#eef3ff;--mut:#8ea6e6;--ok:#86dc54;--ok2:#3fa535;--warn:#f6b92b;--bad:#ff6b7a;--field:#10277c;--deep:#071346}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;min-height:100%;background:radial-gradient(110% 38% at 50% 0,#12308f 0,var(--bg) 70%) no-repeat var(--bg);color:var(--txt);font-family:\"Segoe UI\",Tahoma,system-ui,sans-serif}\n#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}\nheader{display:flex;align-items:center;gap:10px;margin-bottom:14px}\nheader h1{flex:1;text-align:center;font-size:26px;margin:0;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}\nheader img{width:66px;height:66px;border-radius:16px;box-shadow:0 0 0 1px rgba(246,185,43,.55),0 0 18px rgba(var(--glow-rgb),.7)}\nbutton,input{font:inherit;color:inherit}\n.back{background:var(--panel2);border:1px solid var(--line);border-radius:22px;padding:14px 18px;cursor:pointer;box-shadow:0 0 10px rgba(var(--glow-rgb),.25)}\n#q{flex:1;min-width:0;background:var(--field);border:2px solid var(--glow);border-radius:22px;padding:16px 18px;font-size:19px;box-shadow:0 0 16px rgba(var(--glow-rgb),.5);outline:none}\n#q:focus{border-color:var(--gold2);box-shadow:0 0 18px rgba(246,185,43,.45)}\n#q::placeholder{color:var(--mut)}\n.empty{text-align:center;color:var(--mut);padding:18px}\n.ov{position:fixed;inset:0;background:rgba(2,6,22,.82);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 4vh) 14px 14px;padding-top:calc(env(safe-area-inset-top,0px) + 4dvh);z-index:10} /* pop-ups sit in the TOP half so the keyboard never covers them */\n.box{width:100%;max-width:460px;max-height:46vh;max-height:46dvh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(180deg,var(--panel),var(--deep));border:1px solid var(--glow);border-radius:24px;padding:20px;box-shadow:0 0 26px rgba(var(--glow-rgb),.55)}\n.box h2{margin:0 0 14px;font-size:20px;text-align:center;color:var(--gold2)}\n.box input{width:100%;margin-bottom:10px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:17px}\n.big{font-size:32px;font-weight:800;text-align:center;margin:6px 0 12px;color:var(--gold2)}\n.hint{text-align:center;min-height:24px;margin-bottom:10px;font-weight:600}\n.ok{color:var(--ok)}.dbt{color:var(--warn)}\n.btns{display:flex;gap:10px;margin-top:6px}\n.btn{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:13px;font-size:17px;cursor:pointer}\n.btn.p{border:0;background:linear-gradient(135deg,var(--ok),var(--ok2));color:#06142e;font-weight:800}\n.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}\n#toast{position:fixed;inset-inline:16px;top:50vh;top:50dvh;margin:auto;max-width:440px;background:#2a0f2e;border:1px solid var(--bad);border-radius:16px;padding:14px;text-align:center;display:none;z-index:20}\n#toast.okt{background:#0b2a1a;border-color:var(--ok)}\n.gold{background:linear-gradient(135deg,var(--gold2),var(--gold))!important;color:#2a1c00!important;border:0!important;font-weight:800}\n.card{background:linear-gradient(180deg,var(--panel),var(--deep));border:1px solid var(--glow);border-radius:24px;padding:18px;box-shadow:0 0 22px rgba(var(--glow-rgb),.4);margin-bottom:14px}\n.card h3{margin:0 0 10px;color:var(--gold2);font-size:17px}\n.card input{width:100%;margin-bottom:10px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:17px}\n.fl{display:block;color:var(--mut);font-size:13px;margin:6px 0 4px}\n.tbtn{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:20px 8px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 0 10px rgba(var(--glow-rgb),.2)}\n.menu{display:grid;gap:12px}.menu .tbtn{font-size:21px;padding:26px 10px}\n.bar{display:flex;gap:12px;margin-top:16px}\n.tot{flex:1;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--glow);border-radius:24px;padding:12px 20px;box-shadow:0 0 14px rgba(var(--glow-rgb),.35)}\n.tot small{color:var(--mut)}.tot div{font-size:30px;font-weight:700;color:var(--gold2)}\n#pay{flex:1;border:0;border-radius:24px;font-size:24px;font-weight:800;color:#06142e;background:linear-gradient(135deg,var(--ok),var(--ok2));cursor:pointer;box-shadow:0 0 16px rgba(134,220,84,.35)}\n#pay:disabled{opacity:.4;box-shadow:none}\n.bd{background:var(--deep);color:var(--gold);border-radius:8px;padding:2px 7px;margin-inline-end:8px;font-weight:700;font-size:16px}\n.sum{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 20px;margin-bottom:12px;color:var(--mut)}\n.sum b{color:var(--gold2);font-size:22px}\n.wa{background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center}\nbody.typing{padding-bottom:55vh} /* room below a form so a field being typed in can be scrolled into the upper half */\n\n#view #q{display:block;width:100%;margin-bottom:12px}\n.wide{display:block;width:100%;margin-bottom:12px;padding:16px;background:var(--panel2);border:1px solid var(--gold);color:var(--gold2);border-radius:22px;font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 0 12px rgba(246,185,43,.3)}\n.pl{background:linear-gradient(180deg,var(--panel),var(--deep));border:1px solid var(--line);border-radius:26px;padding:10px;min-height:280px;box-shadow:0 0 20px rgba(var(--glow-rgb),.22)}\n.pi{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer}\n.pi:active{background:var(--field)}.pi b{font-size:18px;overflow-wrap:anywhere}.pi small{display:block;color:var(--mut);margin-top:2px;font-size:14px}\n.amt{color:var(--gold2);font-size:21px;font-weight:800;white-space:nowrap}\n<\/style><script>document.addEventListener(\"click\",function(e){var a=e.target.closest(\"[data-nav]\");if(a){e.preventDefault();parent.__nav(a.dataset.nav);}});<\/script><\/head><body>\n<div id=\"app\">\n<header><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHAAAABwCAMAAADxPgR5AAADAFBMVEVfndionmmc4uIebKJmnamfp5sljdNxURtXaWrlrWbX0qqVXl
